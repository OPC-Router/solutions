- AttachmentCount: 0
  CcCount: 0
  Content: |
    <!DOCTYPE html>
    <html>
    <body style="margin:0;padding:24px;background:#f3f4f6;font-family:Segoe UI,Arial,sans-serif;color:#1f2937;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12);">
        <tr>
          <td style="background:[%Color%];color:#ffffff;padding:18px 24px;">
            <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;">[%Severity%]</div>
            <div style="font-size:22px;font-weight:600;margin-top:4px;">[%Title%]</div>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 24px;font-size:15px;line-height:1.5;">[%Message%]</td>
        </tr>
        <tr>
          <td style="padding:0 24px 20px 24px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="font-size:14px;border-collapse:collapse;">
              <tr><td style="padding:8px 0;border-top:1px solid #e5e7eb;color:#6b7280;width:38%;">Source</td><td style="padding:8px 0;border-top:1px solid #e5e7eb;font-weight:600;">[%Source%]</td></tr>
              <tr><td style="padding:8px 0;border-top:1px solid #e5e7eb;color:#6b7280;">Value</td><td style="padding:8px 0;border-top:1px solid #e5e7eb;font-weight:600;">[%Value%]</td></tr>
              <tr><td style="padding:8px 0;border-top:1px solid #e5e7eb;color:#6b7280;">Time</td><td style="padding:8px 0;border-top:1px solid #e5e7eb;font-weight:600;">[%Timestamp%]</td></tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background:#f9fafb;padding:12px 24px;font-size:12px;color:#9ca3af;border-top:1px solid #e5e7eb;">Sent automatically by OPC Router</td>
        </tr>
      </table>
    </body>
    </html>
