- AttachmentCount: 0
  CcCount: 0
  Content: |
    <!DOCTYPE html>
    <html>
    <body style="margin:0;padding:24px;background:#f3f4f6;font-family:Segoe UI,Arial,sans-serif;color:#1f2937;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:640px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12);">
        <tr>
          <td style="background:#1f3a5f;color:#ffffff;padding:18px 24px;">
            <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;">Shift report</div>
            <div style="font-size:22px;font-weight:600;margin-top:4px;">[%Line%] - [%Shift%]</div>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 24px 8px 24px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="border-collapse:separate;border-spacing:8px 0;text-align:center;">
              <tr>
                <td style="background:#eef2ff;border-radius:8px;padding:14px 8px;"><div style="font-size:26px;font-weight:700;color:#1f3a5f;">[%OEE%] %</div><div style="font-size:12px;color:#6b7280;margin-top:2px;">OEE</div></td>
                <td style="background:#f9fafb;border-radius:8px;padding:14px 8px;"><div style="font-size:20px;font-weight:600;">[%Availability%] %</div><div style="font-size:12px;color:#6b7280;margin-top:2px;">Availability</div></td>
                <td style="background:#f9fafb;border-radius:8px;padding:14px 8px;"><div style="font-size:20px;font-weight:600;">[%Performance%] %</div><div style="font-size:12px;color:#6b7280;margin-top:2px;">Performance</div></td>
                <td style="background:#f9fafb;border-radius:8px;padding:14px 8px;"><div style="font-size:20px;font-weight:600;">[%Quality%] %</div><div style="font-size:12px;color:#6b7280;margin-top:2px;">Quality</div></td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 24px 20px 24px;">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="font-size:14px;border-collapse:collapse;">
              <tr><td style="padding:8px 0;border-top:1px solid #e5e7eb;color:#6b7280;width:50%;">Good parts</td><td style="padding:8px 0;border-top:1px solid #e5e7eb;font-weight:600;text-align:right;">[%GoodParts%]</td></tr>
              <tr><td style="padding:8px 0;border-top:1px solid #e5e7eb;color:#6b7280;">Scrap parts</td><td style="padding:8px 0;border-top:1px solid #e5e7eb;font-weight:600;text-align:right;">[%ScrapParts%]</td></tr>
              <tr><td style="padding:8px 0;border-top:1px solid #e5e7eb;color:#6b7280;">Run time (min)</td><td style="padding:8px 0;border-top:1px solid #e5e7eb;font-weight:600;text-align:right;">[%RuntimeMinutes%]</td></tr>
              <tr><td style="padding:8px 0;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;color:#6b7280;">Planned time (min)</td><td style="padding:8px 0;border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;font-weight:600;text-align:right;">[%PlannedMinutes%]</td></tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="background:#f9fafb;padding:12px 24px;font-size:12px;color:#9ca3af;border-top:1px solid #e5e7eb;">Sent automatically by OPC Router. OEE = availability x performance x quality.</td>
        </tr>
      </table>
    </body>
    </html>
