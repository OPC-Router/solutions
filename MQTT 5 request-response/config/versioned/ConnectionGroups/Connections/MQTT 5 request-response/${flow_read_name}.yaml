- LocalId: 700004
  PlugIn: BasePlugInConfig
  PosX: 20
  Summary: '<p>To build your own request handler: copy this sample flow.</p><p><br></p><p>Keep this trigger as is - response topic and correlation data output enabled, <code>traceId</code> user property declared - and replace the middle part (JSON Read, OPC UA Dynamic Read, JSON Write) with your own processing.</p><p>On error, set the <code>Status</code> input of <strong>Answer MQTT request</strong> to something other than <code>ok</code>, or wrap the processing in <em>Error handling (Try/Catch)</em> and answer from the catch branch.</p>'
  _clrType:
  - inray.OPCRouter.BasePlugIn.Config.Note.NoteTransferObjectConfig, inray.OPCRouter4.BasePlugIn
- GridSnapPixel: 18
  LocalId: 700005
  PlugIn: BasePlugInConfig
  PosX: 300
  PosY: 500
  Summary: '<p>This sample only answers the success case: a request with an unknown browse path or without a response topic produces no answer - the transfer fails and is logged.</p><p><br></p><p>For an answer in the error case, wrap the middle part in error handling (e.g. <em>Try/Catch</em>) and call <strong>Answer MQTT request</strong> from the error branch with <code>Status</code> = <code>error</code>.</p>'
  _clrType:
  - inray.OPCRouter.BasePlugIn.Config.Note.NoteTransferObjectConfig, inray.OPCRouter4.BasePlugIn
